# insights.eleviq.solutions dashboard — Cloudflare Worker + static assets.
#
#   npx wrangler dev    --config insights/wrangler.toml   local: http://localhost:8789
#   npx wrangler deploy --config insights/wrangler.toml    -> insights.eleviq.solutions (behind Access)
#
# Reads the same D1 database site-logger writes to (eleviq-site-log) —
# read-only, no writes from here.
#
# LIVE at insights.eleviq.solutions, behind Cloudflare Access. The page shows
# real visitor data, so it must only be reachable through Access (hence
# workers_dev = false below).
#
# custom_domain = true (not zone_name + wildcard, unlike site-logger) —
# insights.eleviq.solutions is a brand-new subdomain with no existing DNS
# record or origin to preserve, so Workers Custom Domains is the simpler
# mechanism: it provisions the DNS record and TLS cert itself.

name = "eleviq-insights"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# false: the automatic *.workers.dev address is not protected by Cloudflare
# Access, so it would expose the dashboard without login. Reachable only via
# insights.eleviq.solutions (behind Access).
workers_dev = false

[vars]
# "true" includes ElevIQ's own test traffic and shows the banner "includes
# ElevIQ test traffic" (requirements INT-4). Consultant deployments only;
# client-facing deployments keep "false". There is no UI switch (INT-3).
SHOW_INTERNAL = "false"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "eleviq-site-log"
database_id = "68dedff2-12ad-4dd7-b19c-d5c81b577a16"

[[routes]]
pattern = "insights.eleviq.solutions"
custom_domain = true
