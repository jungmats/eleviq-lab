# ElevIQ Lab agent gateway — Cloudflare Worker.
#
#   npm run dev:gateway      local: http://localhost:8787
#   npm run deploy:gateway   -> https://eleviq-lab-gateway.<subdomain>.workers.dev
#
# A custom domain (gateway.eleviq.solutions) can be added later, once
# eleviq.solutions' nameservers are on Cloudflare.

name = "eleviq-lab-gateway"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Access log: every verified/refused request to the protected resource, with
# identity. schema.sql defines the table; run it once per environment:
#   npx wrangler d1 execute eleviq-lab-log --local  --file=schema.sql
#   npx wrangler d1 execute eleviq-lab-log --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "eleviq-lab-log"
database_id = "861ffec1-ad63-444f-8b61-e5a4bdc91edd"

# Nonce replay protection: a signature's nonce is remembered until it would
# have expired anyway (TTL set per-entry in code), then KV lets it go.
[[kv_namespaces]]
binding = "NONCES"
id = "7cf4d6ff9a28415aa443a9426a513178"
