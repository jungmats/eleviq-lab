# eleviq.solutions site logger — Cloudflare Worker.
#
#   npx wrangler dev    --config site-logger/wrangler.toml   local: http://localhost:8788
#   npx wrangler deploy --config site-logger/wrangler.toml   -> eleviq-site-logger.<subdomain>.workers.dev
#
# LIVE: the [[routes]] below bind this Worker to all eleviq.solutions traffic.
# Every deploy changes the production site immediately — test locally first
# (npm run test:site-logger, wrangler deploy --dry-run). Rollback:
#   npx wrangler rollback --config site-logger/wrangler.toml
#
# Secret (not in this file): ELEVIQ_INTERNAL_TOKEN — marks ElevIQ's own test
# traffic (requirements INT-2). Set with `wrangler secret put`; one per client.

name = "eleviq-site-logger"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Accept ElevIQ's demo signing key as Verified (LOG-8). "true" only on
# eleviq.solutions — its private half is published, so on a client site it
# would let anyone appear Verified. Client deployments: "false".
ACCEPT_DEMO_SIGNATURES = "true"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "eleviq-site-log"
database_id = "68dedff2-12ad-4dd7-b19c-d5c81b577a16"

[[routes]]
pattern = "eleviq.solutions/*"
zone_name = "eleviq.solutions"

[[routes]]
pattern = "www.eleviq.solutions/*"
zone_name = "eleviq.solutions"
